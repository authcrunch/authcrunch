---
name: docker

on:
  workflow_dispatch:
    inputs:
      publish_type:
        description: Image channel to publish
        required: true
        default: release
        type: choice
        options:
          - release
          - beta
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.publish_type || 'beta' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GOPROXY: https://proxy.golang.org,direct
  GOTOOLCHAIN: local
  PUBLISH_TYPE: ${{ inputs.publish_type || 'beta' }}

jobs:
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # Push container images to GHCR.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false
      - name: Sync beta dependencies
        if: env.PUBLISH_TYPE == 'beta'
        run: |
          make sync
          git diff --cached -- Dockerfile
      - name: Check image version
        run: make check-release-version
      - name: Prepare image tags
        id: image
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/authcrunch"
          if [[ "$PUBLISH_TYPE" == "release" ]]; then
            version="$(cat VERSION)"
            tags="${image}:v${version},${image}:latest"
          else
            tags="${image}:beta"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha,scope=authcrunch-${{ env.PUBLISH_TYPE }}
          cache-to: type=gha,mode=max,scope=authcrunch-${{ env.PUBLISH_TYPE }}
          provenance: mode=max
          sbom: true
